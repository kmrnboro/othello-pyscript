<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Othello Web App</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>オセロ (Othello)</h1>
            <div id="status">黒の番です</div>
        </header>

        <div id="game-board" class="board">
            <!-- Board cells will be generated here -->
        </div>

        <div class="controls">
            <button id="new-game-btn">新規ゲーム (New Game)</button>
            <button id="undo-btn">待った (Undo)</button>

            <div class="options">
                <label for="player-color">プレイヤー (Player):</label>
                <select id="player-color">
                    <option value="black">先手 (黒)</option>
                    <option value="white">後手 (白)</option>
                </select>
            </div>

            <div class="options">
                <label for="ai-level">AIレベル (Level):</label>
                <select id="ai-level">
                    <option value="none">なし (対人戦)</option>
                    <option value="random">初級 (ランダム)</option>
                    <option value="greedy">中級 (貪欲法)</option>
                    <option value="hard">上級 (Minimax)</option>
                </select>
            </div>

            <div class="options">
                <label>
                    <input type="checkbox" id="show-hints-black"> ヒント表示 (黒)
                </label>
                <label>
                    <input type="checkbox" id="show-hints-white"> ヒント表示 (白)
                </label>
            </div>
            <div class="options">
                <label>
                    <input type="checkbox" id="show-best-move-black"> 最善手 (黒)
                </label>
                <label>
                    <input type="checkbox" id="show-best-move-white"> 最善手 (白)
                </label>
            </div>
        </div>

        <div id="log"></div>
    </div>

    <script type="py" src="./src/main.py" config="./pyscript.json"></script>
</body>

</html>
